labeling:
  backend: vllm
  # Aligned with When2Tool src/extract_features.py defaults.
  max_rounds: 12
  max_new_tokens: 2048
  max_model_len: 32768
  # Hardware-dependent: set to the number of GPUs/tensor-parallel shards available.
  tensor_parallel_size: 1
  vllm_dtype: bfloat16
  record_mode: lite
activation_extraction:
  batch_size: 1
  torch_dtype: bfloat16
  device_map: auto
  # Official When2Tool stores extracted hidden states as float32.
  save_dtype: float32
  target_modules:
    - gate_proj
    - up_proj
    - down_proj
single_type_discovery:
  top_k: 5000
  epsilon: 1.0e-8
  min_class_count: 2
