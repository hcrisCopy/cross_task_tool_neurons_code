labeling:
  backend: vllm
  # Aligned with When2Tool src/extract_features.py defaults.
  max_rounds: 12
  max_new_tokens: 2048
  max_model_len: 32768
  # Formal eight-GPU experiment default; smoke runs on smaller machines should override this explicitly.
  tensor_parallel_size: 8
  vllm_dtype: bfloat16
  record_mode: lite
activation_extraction:
  batch_size: 1
  torch_dtype: bfloat16
  device_map: auto
  # Official When2Tool stores extracted hidden states as float32.
  save_dtype: float32
  target_modules:
    - gate_proj
    - up_proj
    - down_proj
single_type_discovery:
  top_k: 5000
  epsilon: 1.0e-8
  min_class_count: 2
training:
  rank: 8
  lora_alpha: 16
  lora_dropout: 0
  epochs: 3
  global_batch_size: 16
  per_device_batch_size: 1
  gradient_accumulation_steps: 16
  learning_rate: 5.0e-5
  warmup_ratio: 0.03
  optimizer: AdamW
  precision: bf16
  max_seq_length: 4096
  trajectory_attempts: 2
  trajectory_batch_size: 1
  max_rounds: 10
  max_new_tokens: 2048
  max_model_len: 32768
evaluation:
  # Official When2Tool run_eval.py defaults to n_runs=3; smoke commands may override to 1.
  n_runs: 3
  batch_size: 1
  max_rounds: 10
  max_new_tokens: 2048
  max_model_len: 32768
  torch_dtype: bfloat16
  prompt_mode: current
  reasoning_mode: no_reasoning
  enable_thinking: false
causal_validation:
  batch_size: 1
  max_rounds: 10
  max_new_tokens: 2048
  max_model_len: 32768
  torch_dtype: bfloat16
  interventions:
    - Base
    - Mask-Random
    - Mask-TDN_c
    - Mask-CTD
    - Mask-Private_c
